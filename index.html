t:700;opacity:.8}.wbtn.is-on{outline:4px solid #fff;transform:translateY(-2px)}.wbtn.is-queued{outline:3px dashed #fff}#stick{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:#ffecbe47;border:3px solid rgba(255,243,196,.9)}#stick-knob{position:absolute;left:47px;top:47px;width:56px;height:56px;border-radius:50%;background:linear-gradient(#ffe7a4,#e09018);border:3px solid white}#actions{position:absolute;right:calc(22px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));display:grid;grid-template-columns:116px 116px;gap:22px 26px}#btn-attack{grid-column:1 / -1;height:92px}.act{position:relative;overflow:hidden;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center}.act strong{font-size:16px}.act small{font-size:11px}.attack{background:linear-gradient(#ff6a4a,#c1121f);color:#fff;box-shadow:0 6px #6a0410,0 10px 16px #00000059}.attack.in-range{outline:4px solid #fff3a0}.attack.is-active{filter:brightness(1.35)}.attack.is-windup{filter:saturate(1.2) brightness(.95)}.cd{position:absolute;left:0;right:0;bottom:0;height:100%;background:#14080673;transform:scaleY(0);transform-origin:bottom;pointer-events:none}.secs{position:absolute;top:4px;right:8px;font-style:normal;font-size:13px}#result{justify-content:center}#result-body{max-width:560px;font-size:18px}#rotate-hint{display:none;position:absolute;top:8px;left:50%;transform:translate(-50%);background:#0000008c;color:#fff;padding:6px 12px;border-radius:999px;pointer-events:none}@media(orientation:portrait){#rotate-hint{display:block}#weapons{gap:18px}.wbtn{width:92px;height:64px}#stick{width:120px;height:120px}#stick-knob{left:36px;top:36px}}#bars{position:absolute;inset:0;pointer-events:none}.ebar{position:absolute;width:64px;height:8px;margin-left:-32px;background:#3a1212;border:1px solid #fff;border-radius:99px;overflow:hidden}.ebar span{display:block;height:100%;width:100%;transform-origin:left center;background:#ff5a3c}.floater{position:absolute;font-weight:900;font-size:22px;text-shadow:0 2px 0 #000;pointer-events:none;transform:translate(-50%,-50%)}#fatal,#combat-check{position:absolute;left:12px;right:12px;bottom:12px;max-height:40vh;overflow:auto;background:#000c;color:#fff;font-size:12px;pointer-events:auto;white-space:pre-wrap}#combat-check{top:12px;bottom:auto;z-index:5}@keyframes pop{0%{opacity:0;transform:translate(-50%) scale(.6)}25%{opacity:1;transform:translate(-50%) scale(1.08)}to{opacity:0;transform:translate(-50%) scale(1)}}@keyframes slide{0%{opacity:0;transform:translate(-60%)}to{opacity:1;transform:translate(-50%)}}</style>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="vignette"></div>
      <div id="ui">
        <div id="title">
          <p class="eyebrow">Flavian Arena</p>
          <h1>Arena Clash</h1>
          <p class="tag">Ride the sand. Three weapons. One consul.</p>
          <button id="btn-start" type="button">Tap to enter the arena</button>
        </div>
        <div id="hud" class="hidden">
          <div id="player-hp" class="hp">
            <div class="hp-top"><span>Marcus</span><strong id="player-num">130</strong></div>
            <div class="hp-track"><span id="player-fill"></span></div>
          </div>
          <button id="btn-mute" type="button">Mute</button>
          <div id="boss-panel" class="hp boss hidden">
            <div class="hp-top"><span>Titus the Iron Consul</span><strong id="boss-num">240</strong></div>
            <div class="hp-track"><span id="boss-fill"></span></div>
          </div>
          <p id="objective"></p>
          <div id="flourish"></div>
        </div>
        <div id="banner" class="hidden">
          <p id="banner-kicker"></p>
          <h2 id="banner-title"></h2>
          <p id="banner-sub"></p>
        </div>
        <button id="btn-skip" type="button">Tap to skip</button>
        <div id="bars"></div>
        <div id="controls" class="hidden">
          <div id="weapons">
            <button class="wbtn" type="button" data-weapon="sword"><span>Sword</span><small>Fast arc</small></button>
            <button class="wbtn" type="button" data-weapon="flail"><span>Flail</span><small>Heavy</small></button>
            <button class="wbtn" type="button" data-weapon="spear"><span>Spear</span><small>Thrown</small></button>
          </div>
          <div id="stick" aria-label="Ride">
            <div id="stick-knob"></div>
          </div>
          <div id="actions">
            <button id="btn-shield" type="button" class="act"><span class="cd"></span><strong>Shield</strong><small>Block</small></button>
            <button id="btn-chariot" type="button" class="act"><span class="cd"></span><strong>Chariot</strong><small>Ram</small><em class="secs"></em></button>
            <button id="btn-attack" type="button" class="act attack"><strong>Slash</strong><small>Hit on the flash</small></button>
          </div>
        </div>
        <div id="result" class="hidden">
          <h2 id="result-title"></h2>
          <p id="result-body"></p>
          <button id="btn-again" type="button">Tap to ride again</button>
        </div>
        <p id="rotate-hint">Landscape plays best</p>
        <pre id="fatal"></pre>
        <pre id="combat-check" class="hidden"></pre>
      </div>
    </div>
  </body>
</html>
